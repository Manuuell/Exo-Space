<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exo Space — Model viewer</title>
  </head>
  <body>
    <canvas id="view" class="fill"></canvas>
    <div class="panel">
      <h1>Model viewer</h1>
      <label>Model <select id="model"></select></label>
      <label>Scene <select id="scene"></select></label>
      <label id="planet-label" hidden>Planet <select id="planet"></select></label>
      <label id="hold-label" hidden>In hand <select id="hold"></select></label>
      <div class="buttons" id="clips"></div>
      <div class="timeline" id="timeline" hidden><div class="playhead" id="playhead"></div></div>
      <p class="info" id="timing" hidden></p>
      <label>Speed <span id="speed-value">1.00×</span>
        <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1" />
      </label>
      <div class="buttons">
        <button id="download" type="button">Download GLB</button>
        <a class="button" id="sheet" href="references.html">View sheet</a>
        <a class="button" href="references.html?view=lineup">Line-up</a>
      </div>
      <p class="info" id="info"></p>
    </div>
    <script type="module" src="/src/models/viewers/models.ts"></script>
  </body>
</html>
